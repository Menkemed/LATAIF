  payoutConfirm: () => { const m = S.modal; const u = S.data.purchases.find((x) => x.id === m.id); const a = r3(num(m.amount));
    if (a <= 0) { m.err = 'Enter an amount above 0.'; return; } if (a > purOpen(u) + 0.0005) { m.err = `More than the open amount (${fmt(purOpen(u))}).`; return; } if (m.date > TODAY) { m.err = 'The date cannot be in the future.'; return; }
    u.paid = r3(u.paid + a); u.payouts.push({ date: m.date, method: m.method, amount: a }); const d = inv(u.inv); d.history.push({ at: stamp(), who: roleLabel(S.role), reason: 'Consignor payout', changes: [`${kon(u.k).name}: ${fmt(a)} BHD paid out on ${u.no}`] }); S.modal = null; persist(); toast('Payout recorded (simulation)'); },
  returnOpen: (ds) => { S.modal = { type: 'return', id: ds.id, line: '', qty: '1' }; },
  returnConfirm: () => { const m = S.modal; const d = inv(m.id); const l = d.lines.find((x) => x.id === m.line); if (!l) return;
    const left = num(l.qty) - num(l.returnedQty || 0); const q = Math.round(num(m.qty));
    if (q < 1 || q > left) { m.err = `Return between 1 and ${left} piece(s).`; return; }
    const no = 'RET-2026-' + String(S.data.seq.ret++).padStart(4, '0'); const amt = r3(num(l.unit) * q);
    l.returnedQty = num(l.returnedQty || 0) + q; l.retNo = l.retNo ? l.retNo + ', ' + no : no; prod(l.ref).stock += q;
    S.data.returnCredit[d.id] = r3((S.data.returnCredit[d.id] || 0) + amt); d.history.push({ at: stamp(), who: roleLabel(S.role), reason: 'Return ' + no, changes: [`${q} of ${l.qty} ${l.desc} returned · ${fmt(amt)} BHD as customer credit`] }); S.modal = null; persist(); toast(`Return ${no} created (simulation)`); },
  refundOpen: (ds) => { const t = calcInv({ ...inv(ds.id), payRows: [] }); S.modal = { type: 'refund', id: ds.id, method: 'cash', amount: t.over.toFixed(3), date: TODAY }; },
  refundConfirm: () => { const m = S.modal; const d = inv(m.id); const t = calcInv({ ...d, payRows: [] }); const a = r3(num(m.amount));
    if (a <= 0) { m.err = 'Enter an amount above 0.'; return; } if (a > t.over + 0.0005) { m.err = `More than the refund owed (${fmt(t.over)}).`; return; }
    if (m.date > TODAY || m.date < lastMoneyDay(d)) { m.err = `The date must lie between ${dmy(lastMoneyDay(d))} and today.`; return; }
    d.refunds = [...(d.refunds || []), { date: m.date, method: m.method, amount: a }]; d.history.push({ at: stamp(), who: roleLabel(S.role), reason: 'Refund to customer', changes: [`Refund ${fmt(a)} BHD ${methodLabel(m.method)} paid out (${dmy(m.date)}) · still owed ${fmt(t.over - a)} BHD`] }); S.modal = null; persist(); toast('Refund recorded (simulation)'); },
  payLoss: (ds) => { const x = S.data.losses.find((y) => y.id === ds.id); if (!x) return; x.paid = true; inv(x.inv).history.push({ at: stamp(), who: roleLabel(S.role), reason: 'Consignor Loss paid', changes: [`${x.no}: ${fmt(x.amount)} BHD paid (${cons(x.cs).name})`] }); persist(); toast('Expense paid (simulation)'); },
  history: (ds) => { S.modal = { type: 'history', id: ds.id }; },
  decisions: (ds) => { S.modal = { type: 'decisions', focus: ds.focus || null }; },
  closeModal: () => { S.modal = null; },
  closeModalBg: (ds, el, ev) => { if (ev.target === el) S.modal = null; else return 'skip'; },
  drawer: () => { S.drawer = !S.drawer; },
  role: (ds) => { S.role = ds.v; persist(); },
  q3: () => { S.q3Filed = !S.q3Filed; persist(); if (S.draft && S.draft.mode === 'edit') S.draft = editDraft(S.draft.id); },
  reset: () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ohne Speicher */ } S.data = seed(); S.role = 'ADMIN'; S.q3Filed = true; S.draft = null; S.expanded = {}; S.drawer = false; go('#/invoices'); toast('Demo data reset'); },
  scn: (ds) => { S.drawer = false; if (ds.v === 'new') A.new(); else if (ds.v === 'cons') go('#/consignments'); else go('#/invoices/' + ds.v); },
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;

window.addEventListener('popstate', route);

route();
